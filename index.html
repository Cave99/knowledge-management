<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ee" />
    <meta name="description" content="A quieter place for your team's knowledge. Browse guides, playbooks, and shared resources, all from plain Markdown files." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
    <title>KM flow — Team knowledge, together</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('kmflow:theme') || '"system"');
        document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
